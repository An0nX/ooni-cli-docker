name: Build & Push

on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force build even if tag exists"
        type: boolean
        default: false
      version:
        description: "Upstream version (e.g. v3.29.0), empty = latest"
        type: string
        required: false

concurrency:
  group: build-ooniprobe
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  IMAGE: whn0thacked/ooniprobe
  UPSTREAM: ooni/probe-cli
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6,linux/386,linux/ppc64le,linux/s390x

jobs:
  # ── Check ──
  check:
    name: Check upstream
    runs-on: ubuntu-latest
    outputs:
      version:      ${{ steps.ver.outputs.version }}
      should_build: ${{ steps.decide.outputs.should_build }}
    steps:
      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            ver="${{ inputs.version }}"
          else
            ver=$(curl -fsSL \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${UPSTREAM}/releases/latest" \
              | jq -r '.tag_name')
          fi
          [ -z "$ver" ] || [ "$ver" = "null" ] && { echo "No version" >&2; exit 1; }
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Check Docker Hub
        id: hub
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://hub.docker.com/v2/repositories/${IMAGE}/tags/${{ steps.ver.outputs.version }}/" || true)
          echo "exists=$([ "$code" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Decide
        id: decide
        run: |
          if [ "${{ inputs.force }}" = "true" ] || [ "${{ steps.hub.outputs.exists }}" = "false" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Build ──
  build:
    name: Build multi-arch
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with: { platforms: all }

      - uses: docker/setup-buildx-action@v3
        with: { driver: docker-container }

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.check.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ needs.check.outputs.version }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ env.PLATFORMS }}
          build-args: |
            OONI_VERSION=${{ needs.check.outputs.version }}
          tags:   ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build
          cache-to:   type=gha,scope=build,mode=max
          sbom: true
          provenance: true

      - name: Inspect manifest
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ needs.check.outputs.version }}"

      # ── Trivy → GitHub Security ──
      - name: Trivy scan (SARIF)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: docker.io/${{ env.IMAGE }}:${{ needs.check.outputs.version }}
          format: sarif
          output: trivy.sarif
          vuln-type: os
          severity: CRITICAL,HIGH,MEDIUM

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy.sarif

      # ── Copa best-effort (amd64) ──
      - name: Trivy scan (JSON for Copa)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: docker.io/${{ env.IMAGE }}:${{ needs.check.outputs.version }}
          format: json
          output: copa-report.json
          ignore-unfixed: true
          vuln-type: os

      - name: Copa patch
        id: copa
        uses: project-copacetic/copa-action@main
        continue-on-error: true
        with:
          image:      docker.io/${{ env.IMAGE }}:${{ needs.check.outputs.version }}
          report:     copa-report.json
          patched-tag: ${{ needs.check.outputs.version }}-copa

      - name: Push Copa image
        if: steps.copa.outcome == 'success'
        run: |
          docker push "${{ env.IMAGE }}:${{ needs.check.outputs.version }}-copa"
          echo "✅ Copa-patched: ${{ env.IMAGE }}:${{ needs.check.outputs.version }}-copa (amd64)"
